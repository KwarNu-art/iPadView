name: Build iPadView dylib
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Compile dylib
        run: |
          SOURCE_FILE=$(ls .m | head -n 1)
          echo "Found source file: $SOURCE_FILE"
          clang -dynamiclib -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=12.0 \
            -framework Foundation -framework UIKit \
            -O3 \
            "$SOURCE_FILE" -o iPadView.dylib
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPadView-dylib
          path: iPadView.dylib
